<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таблицы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
    .block { border: 1px solid #ccc; padding: 12px; border-radius: 8px; margin-bottom: 15px; background: var(--tg-theme-secondary-bg-color, #f9f9f9); }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
    .hint { font-weight: normal; font-size: 12px; opacity: 0.7; }
    input, select { width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
    .btn { background: #2e7d32; color: white; padding: 14px; border: none; border-radius: 6px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <h2 style="margin-bottom: 20px;">Внести заправку в таблицу</h2>
  <form id="form">
    <div class="block">
      <label for="network">Сеть:</label>
      <select id="network" required>
        <option value="Вог">Вог</option>
        <option value="Окко">Окко</option>
        <option value="Амик">Амик</option>
        <option value="Укрнафта">Укрнафта</option>
      </select>

      <label for="card">Номер карты:</label>
      <input type="text" id="card" inputmode="numeric" required placeholder="Например: 903407">

      <label for="fio">ФИО перевозчика:</label>
      <input type="text" id="fio" required placeholder="Например: Шеремета Андрей">

      <label for="liters">Литры:</label>
      <input type="number" id="liters" step="any" min="0" required placeholder="40">

      <label for="price">Цена за литр: <span class="hint">(можно не заполнять)</span></label>
      <input type="number" id="price" step="any" min="0" placeholder="93.2">

      <label for="stella">Стелла:</label>
      <input type="number" id="stella" step="any" placeholder="96.9">

      <label for="table">Таблица:</label>
      <select id="table" required>
        <option value="DT">DT</option>
        <option value="TENT">TENT</option>
        <option value="ZERNO">ZERNO</option>
      </select>
    </div>
    <button type="submit" class="btn">ВНЕСТИ В ТАБЛИЦУ</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      const val = id => document.getElementById(id).value.trim();
      tg.sendData(JSON.stringify({
        action: "table_row",
        network: val('network'),
        card: val('card'),
        fio: val('fio'),
        liters: val('liters'),
        price: val('price'),
        stella: val('stella'),
        table: val('table')
      }));
    });
  </script>
</body>
</html>
