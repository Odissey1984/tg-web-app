<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelLogix 2</title>
    <script>
        function sendData(action, data) {
            window.Telegram.WebApp.sendData(JSON.stringify({action, ...data}));
        }

        function uploadOkko() {
            sendData('upload', {source: 'Okko'});
        }

        function uploadUkrnafta() {
            sendData('upload', {source: 'Ukrnafta'});
        }

        function deleteCarrier(carrier) {
            sendData('delete', {carrier});
        }

        function moveCarrier(carrier, newSheet) {
            sendData('move', {carrier, new_sheet_name: newSheet});
        }
    </script>
</head>
<body>
    <h1>FuelLogix 2</h1>
    <button onclick="uploadOkko()">Upload Okko File</button>
    <button onclick="uploadUkrnafta()">Upload Ukrnafta File</button>
    <div>
        <h2>Delete Carrier</h2>
        <input type="text" id="carrierToDelete" placeholder="Enter carrier name">
        <button onclick="deleteCarrier(document.getElementById('carrierToDelete').value)">Delete</button>
    </div>
    <div>
        <h2>Move Carrier</h2>
        <input type="text" id="carrierToMove" placeholder="Enter carrier name">
        <select id="newSheetName">
            <option value="TENT">TENT</option>
            <option value="ZERNO">ZERNO</option>
        </select>
        <button onclick="moveCarrier(document.getElementById('carrierToMove').value, document.getElementById('newSheetName').value)">Move</button>
    </div>
</body>
</html>
