<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelLogix 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
        input {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>FuelLogix 2</h2>
        <button onclick="openFile('Okko')">Добавить файл Okko</button>
        <button onclick="openFile('Укрнафта')">Добавить файл Укрнафта</button>
        <div>
            <input type="text" id="carrierName" placeholder="ФИО перевозчика">
            <button onclick="deleteCarrier()">Удалить перевозчика</button>
        </div>
    </div>

    <script>
        function openFile(source) {
            window.Telegram.WebApp.sendData(JSON.stringify({ action: 'upload', source: source }));
        }

        function deleteCarrier() {
            const carrierName = document.getElementById('carrierName').value;
            if (carrierName.trim() === '') {
                alert('Введите ФИО перевозчика');
                return;
            }
            window.Telegram.WebApp.sendData(JSON.stringify({ action: 'delete', carrier: carrierName }));
        }
    </script>
</body>
</html>
